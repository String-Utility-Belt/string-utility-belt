<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online String Utility Pipeline Builder | String Utility Belt</title>
  <meta name="description" content="Chain string utilities into reusable pipelines. Preview each step, save and share your tool chains, and process text locally in your browser." />
  <meta name="robots" content="max-image-preview:large" />
  <meta name="theme-color" content="#f8f7f3" />
  <!-- Search Console ownership of https://stringutilitybelt.com/; keep it -->
  <meta name="google-site-verification" content="Qk-RujAWPTyGcrpnsvXuecqvd56489XSYWgKJ1YGA9Y" />
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <!-- the body font's Latin file, which src/index.css also loads: Vite gives both the same hashed /assets URL -->
  <link rel="preload" href="./node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // apply the saved theme before first paint so dark mode never flashes light
    // (its SHA-256 is in the CSP, public/_headers: `npm test` names the new hash after an edit)
    (function () {
      try {
        var pref = JSON.parse(localStorage.getItem('sub:pref:theme') || '"system"');
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>

<body class="min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
